paths:
  /api/orders:
    get:
      summary: Listar pedidos
      description: Devuelve todos los pedidos registrados.
      tags:
        - Orders
      responses:
        "200":
          description: Lista de pedidos
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      payload:
                        type: array
                        items:
                          $ref: "#/components/schemas/Order"
        "500":
          $ref: "#/components/responses/InternalServerError"
    post:
      summary: Crear pedido
      description: Crea un pedido nuevo.
      tags:
        - Orders
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderCreate"
      responses:
        "201":
          description: Pedido creado
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      payload:
                        $ref: "#/components/schemas/Order"
        "400":
          description: Datos faltantes o inválidos, o JSON mal formado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                faltanDatos:
                  $ref: "#/components/examples/ValidationError"
                datosInvalidos:
                  $ref: "#/components/examples/InvalidData"
                jsonInvalido:
                  $ref: "#/components/examples/InvalidJsonBody"
                idInvalido:
                  $ref: "#/components/examples/InvalidIdMongoose"
        "404":
          description: No existe el cliente o el comercio indicados
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                usuarioNoEncontrado:
                  $ref: "#/components/examples/UserNotFound"
                comercioNoEncontrado:
                  $ref: "#/components/examples/StoreNotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/orders/{oid}:
    get:
      summary: Obtener pedido por ID
      description: Devuelve un pedido según su ID.
      tags:
        - Orders
      parameters:
        - name: oid
          in: path
          description: ID del pedido a buscar
          required: true
          schema:
            $ref: "#/components/schemas/ObjectId"
      responses:
        "200":
          description: Pedido encontrado
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      payload:
                        $ref: "#/components/schemas/Order"
        "400":
          description: El ID no tiene un formato válido.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                idInvalido:
                  $ref: "#/components/examples/InvalidIdMongoose"
        "404":
          description: No existe un pedido con ese ID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                pedidoNoEncontrado:
                  $ref: "#/components/examples/OrderNotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
    delete:
      summary: Eliminar pedido
      description: Elimina un pedido según su ID.
      tags:
        - Orders
      parameters:
        - name: oid
          in: path
          description: ID del pedido a eliminar
          required: true
          schema:
            $ref: "#/components/schemas/ObjectId"
      responses:
        "200":
          description: Pedido eliminado
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      payload:
                        $ref: "#/components/schemas/Order"
        "400":
          description: El ID no tiene un formato válido.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                idInvalido:
                  $ref: "#/components/examples/InvalidIdMongoose"
        "404":
          description: No existe un pedido con ese ID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                NoEncontrado:
                  $ref: "#/components/examples/OrderNotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/orders/{oid}/status:
    put:
      summary: Actualizar estado del pedido
      description: Actualiza el estado de un pedido según su ID.
      tags:
        - Orders
      parameters:
        - name: oid
          in: path
          description: ID del pedido
          required: true
          schema:
            $ref: "#/components/schemas/ObjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderStatusUpdate"
      responses:
        "200":
          description: Pedido actualizado
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      payload:
                        $ref: "#/components/schemas/Order"
        "400":
          description: El ID no tiene un formato válido, el estado no existe o el JSON está mal formado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                idInvalido:
                  $ref: "#/components/examples/InvalidIdMongoose"
                estadoInvalido:
                  $ref: "#/components/examples/InvalidOrderStatus"
                jsonInvalido:
                  $ref: "#/components/examples/InvalidJsonBody"
        "404":
          description: No existe un pedido con ese ID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                pedidoNoEncontrado:
                  $ref: "#/components/examples/OrderNotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/orders/{oid}/proof:
    post:
      summary: Subir comprobante de entrega
      description: |
        Sube el comprobante de entrega de un pedido (PDF, JPEG, PNG o WEBP, máximo 5 MB).
        El archivo se guarda en el servidor (`uploads/proofs`) y sus metadatos se registran en el campo `proof` del pedido.
        Si el pedido ya tenía comprobante, el nuevo lo reemplaza.
      tags:
        - Orders
      parameters:
        - in: path
          name: oid
          required: true
          description: ID del pedido
          schema:
            $ref: "#/components/schemas/ObjectId"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [proof]
              properties:
                proof:
                  type: string
                  format: binary
                  description: Comprobante a subir (campo `proof`). PDF, JPEG, PNG o WEBP, hasta 5 MB.
      responses:
        "200":
          description: Comprobante cargado. Devuelve el pedido actualizado.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      payload:
                        $ref: "#/components/schemas/Order"
        "400":
          description: Archivo faltante, tipo de archivo inválido, campo de archivo incorrecto o ID inválido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                archivoRequerido:
                  $ref: "#/components/examples/FileRequired"
                tipoArchivoInvalido:
                  $ref: "#/components/examples/InvalidFileType"
                campoInvalido:
                  $ref: "#/components/examples/InvalidFileField"
                idInvalido:
                  $ref: "#/components/examples/InvalidIdMongoose"
        "404":
          description: No existe un pedido con ese ID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                pedidoNoEncontrado:
                  $ref: "#/components/examples/OrderNotFound"
        "413":
          description: El archivo supera el tamaño máximo permitido (5 MB)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                archivoGrande:
                  $ref: "#/components/examples/FileTooLarge"
        "500":
          description: Error al guardar el archivo o error inesperado del servidor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                errorAlGuardar:
                  $ref: "#/components/examples/UploadError"
                errorInterno:
                  $ref: "#/components/examples/InternalServerErrorCode"
