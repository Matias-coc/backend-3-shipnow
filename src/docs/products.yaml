paths:
  /api/products:
    get:
      summary: Listar productos
      description: Devuelve todos los productos registrados.
      tags:
        - Products
      responses:
        "200":
          description: Lista de productos
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      payload:
                        type: array
                        items:
                          $ref: "#/components/schemas/Product"
        "500":
          $ref: "#/components/responses/InternalServerError"
    post:
      summary: Crear producto
      description: Crea un producto de un comercio. El estado (status) se calcula automáticamente según el stock.
      tags:
        - Products
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductCreate"
      responses:
        "201":
          description: Producto creado
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      payload:
                        $ref: "#/components/schemas/Product"
        "400":
          description: Datos faltantes o inválidos, o JSON mal formado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                faltanDatos:
                  $ref: "#/components/examples/ValidationError"
                datosInvalidos:
                  $ref: "#/components/examples/InvalidData"
                jsonInvalido:
                  $ref: "#/components/examples/InvalidJsonBody"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/products/{pid}:
    get:
      summary: Obtener producto por ID
      description: Devuelve un producto según su ID.
      tags:
        - Products
      parameters:
        - name: pid
          in: path
          description: ID del producto
          required: true
          schema:
            $ref: "#/components/schemas/ObjectId"
      responses:
        "200":
          description: Producto encontrado
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      payload:
                        $ref: "#/components/schemas/Product"
        "400":
          description: El ID no tiene un formato válido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                idInvalido:
                  $ref: "#/components/examples/InvalidIdMongoose"
        "404":
          description: No existe un producto con ese ID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                noEncontrado:
                  $ref: "#/components/examples/ProductNotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
    put:
      summary: Actualizar producto
      description: Actualiza un producto según su ID. Solo se modifican los campos que se envían. Si se envía stock, el estado se recalcula automáticamente.
      tags:
        - Products
      parameters:
        - name: pid
          in: path
          description: ID del producto
          required: true
          schema:
            $ref: "#/components/schemas/ObjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductUpdate"
      responses:
        "200":
          description: Producto actualizado
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      payload:
                        $ref: "#/components/schemas/Product"
        "400":
          description: El ID no tiene un formato válido, los datos enviados son inválidos o el JSON está mal formado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                idInvalido:
                  $ref: "#/components/examples/InvalidIdMongoose"
                datosInvalidos:
                  $ref: "#/components/examples/InvalidData"
                jsonInvalido:
                  $ref: "#/components/examples/InvalidJsonBody"
        "404":
          description: No existe un producto con ese ID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                noEncontrado:
                  $ref: "#/components/examples/ProductNotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
    delete:
      summary: Eliminar producto
      description: Elimina un producto según su ID.
      tags:
        - Products
      parameters:
        - name: pid
          in: path
          description: ID del producto
          required: true
          schema:
            $ref: "#/components/schemas/ObjectId"
      responses:
        "200":
          description: Producto eliminado
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      payload:
                        $ref: "#/components/schemas/Product"
        "400":
          description: El ID no tiene un formato válido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                idInvalido:
                  $ref: "#/components/examples/InvalidIdMongoose"
        "404":
          description: No existe un producto con ese ID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                noEncontrado:
                  $ref: "#/components/examples/ProductNotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"